<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D3B66" />
    <meta name="author" content="Brian Garcia Rueda" />
    <meta
      name="description"
      content="Mi Cuarto UT: busca, compara y publica cuartos y departamentos para tu vida universitaria. Tu espacio, más cerca de la universidad."
    />
    <meta
      property="og:title"
      content="Mi Cuarto UT | Tu espacio, más cerca de la universidad"
    />
    <meta
      property="og:description"
      content="Un espacio para comenzar tu siguiente etapa universitaria. Compara alojamiento por precio, tamaño y servicios."
    />
    <meta property="og:type" content="website" />
    <title>{{title}}</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="assets/Montserrat-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/Montserrat-Bold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body data-route="{{route}}">
    <a class="skip" href="#contenido">Ir al contenido</a>
    <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-search" viewBox="0 0 24 24">
          <path d="m16 16 6 6M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0" />
        </symbol>
        <symbol id="i-heart" viewBox="0 0 24 24">
          <path d="m12 21-9-9C-3 5 7-1 12 6c5-7 15-1 9 6Z" />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24">
          <path d="M12 22s8-7 8-13A8 8 0 0 0 4 9c0 6 8 13 8 13Z" />
          <circle cx="12" cy="9" r="3" />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path d="m2 11 10-9 10 9M5 9v13h14V9M9 22v-8h6v8" />
        </symbol>
        <symbol id="i-bed" viewBox="0 0 24 24">
          <path d="M2 21V7M2 16h20v5M2 11h17q3 0 3 3v2M5 7h5v4H5Z" />
        </symbol>
        <symbol id="i-size" viewBox="0 0 24 24">
          <path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5M4 4l6 6M20 20l-6-6" />
        </symbol>
        <symbol id="i-wifi" viewBox="0 0 24 24">
          <path d="M2 8q10-10 20 0M5 12q7-7 14 0M9 16q3-3 6 0M12 20h.1" />
        </symbol>
        <symbol id="i-book" viewBox="0 0 24 24">
          <path d="M2 3h7l3 3 3-3h7v17h-7l-3 2-3-2H2ZM12 6v16" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <circle cx="12" cy="7" r="5" />
          <path d="M3 23v-4q0-6 9-6t9 6v4" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24">
          <path d="M3 12h17m-6-6 6 6-6 6" />
        </symbol>
        <symbol id="i-menu" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </symbol>
        <symbol id="i-filter" viewBox="0 0 24 24">
          <path d="M2 6h20M2 12h20M2 18h20M8 3v6M16 9v6M10 15v6" />
        </symbol>
        <symbol id="i-paw" viewBox="0 0 24 24">
          <path
            d="M7 10a2 3 0 1 1-4 0 2 3 0 0 1 4 0M12 5a2 3 0 1 1-4 0 2 3 0 0 1 4 0M18 5a2 3 0 1 1-4 0 2 3 0 0 1 4 0M23 10a2 3 0 1 1-4 0 2 3 0 0 1 4 0M6 19q-1-4 3-5l3-3 3 3q4 1 3 5-1 4-6 1-5 3-6-1Z"
          />
        </symbol>
        <symbol id="i-map" viewBox="0 0 24 24">
          <path d="m2 4 7-3 6 3 7-3v19l-7 3-6-3-7 3ZM9 1v19M15 4v19" />
        </symbol>
        <symbol id="i-lock" viewBox="0 0 24 24">
          <path d="M6 10V7a6 6 0 0 1 12 0v3M4 10h16v13H4ZM12 15v4" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m4 12 5 5L20 5" />
        </symbol>
        <symbol id="i-upload" viewBox="0 0 24 24">
          <path d="M12 16V2m-6 6 6-6 6 6M3 15v7h18v-7" />
        </symbol>
        <symbol id="i-bath" viewBox="0 0 24 24">
          <path
            d="M2 12h20v3q0 5-5 5H7q-5 0-5-5ZM5 12V5q0-3 4-3l2 2M8 4l4-2M6 20v2M18 20v2"
          />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="m5 5 14 14M19 5 5 19" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 3v18M3 12h18" />
        </symbol>
      </defs>
    </svg>
    <header class="site-header" id="cabecera">{{header}}</header>
    <main id="contenido" tabindex="-1">{{content}}</main>
    <footer id="pie" class="site-footer">{{footer}}</footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="dialogo" aria-labelledby="dialog-title">
      <button
        type="button"
        class="icon-button dialog-close"
        data-action="close-dialog"
        aria-label="Cerrar"
      >
        ×
      </button>
      <div id="dialog-content"></div>
    </dialog>
    <noscript
      ><div class="container notice">
        Activa JavaScript para buscar espacios, guardar favoritos y publicar
        inmuebles. Puedes escribir a micuartout@gmail.com para solicitar
        información.
      </div></noscript
    >
  </body>
</html>
